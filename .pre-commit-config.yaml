repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint
        entry: poetry run ruff check api db main.py settings.py
        language: system
        pass_filenames: false
      - id: ruff-format-check
        name: ruff format check
        entry: poetry run ruff format --check api db main.py settings.py
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: poetry run mypy api db main.py settings.py
        language: system
        pass_filenames: false